name: Fork maintenance verification
on:
  push:
    branches: [verify/61-fork-checks]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3520edd0ccdaee6726abb89ec1cf72b843585f66
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 PyYAML
      - name: Verify the fork's PR and CI policies
        run: >-
          python -m pytest -q tests/test_ci_runtime_scope.py tests/test_ci_required_gate.py
          tests/test_nix_runtime_scope.py tests/test_merge_queue.py tests/test_trusted_pr_workflows.py
          tests/test_cla_audit.py tests/test_identity_gate.py tests/test_ci_pass_cache.py
          tests/test_changelog_fragments.py
  dubbing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_CACHE: /tmp/fit-report-empty-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 123a66f9b51eed226f0e15e1165413d21b110eda
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Verify the published fit-report adapter
        run: python -m pytest -q tests/test_hosted_dub_fit_report.py
      - name: Install CPU regression dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          packages = tomllib.loads(Path("uv.lock").read_text())["package"]
          wheels = [
              wheel["url"] + "#" + wheel["hash"].replace(":", "=", 1)
              for package in packages
              if package["name"] in {"torch", "torchaudio"} and package["version"] == "2.10.0+cpu"
              for wheel in package["wheels"]
              if "cp312-cp312-manylinux" in wheel["url"] and "x86_64" in wheel["url"]
          ]
          assert len(wheels) == 2
          subprocess.run([sys.executable, "-m", "pip", "install", *wheels,
                          "fastapi==0.136.3", "httpx==0.28.1", "python-multipart", "numpy", "scipy",
                          "soundfile==0.14.0", "imageio-ffmpeg", "pydub", "psutil",
                          "python-dotenv", "PyYAML", "requests"], check=True)
          PY
      - name: Exercise the existing timing and translation regressions
        run: >-
          python -m pytest -q --tb=short tests/test_hosted_dub_fit_report.py tests/test_fit_planner.py
          tests/test_duration_planner.py tests/test_dub_timing_strategy.py tests/test_translator.py
          tests/test_changelog_fragments.py
