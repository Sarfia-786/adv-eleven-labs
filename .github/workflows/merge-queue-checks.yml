# Commit identity checks run against PR metadata. The queue carries their
# result onto its temporary commit while CI tests the combined code.

name: merge-queue

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  identities:
    name: Commit identities
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Commit identities were checked on the pull request before it was queued."

  statuses:
    name: Queue statuses
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Report the pull request statuses on the merge group commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=success -f context="Commit identity policy" \
            -f description="Checked on the pull request before it was queued"
